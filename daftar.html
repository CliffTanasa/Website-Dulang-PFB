<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register to Dulang</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <div class="icon">
                <i class="fa fa-user"></i>
            </div>
            <h2>Buat Akun</h2>
        </div>

        <form class="register-form" action="Masuk.html">
            <div class="input-group">
                <label>Full Name</label>
                <div class="input-field">
                    <i class="fa fa-user"></i>
                    <input type="text" placeholder="Enter your full name" name="name" id="fullname">
                </div>
                <span class="error-info" id="nameerror"></span>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <div class="input-field">
                    <i class="fa fa-envelope"></i>
                    <input type="email" name="email" placeholder="Enter your email" id="email">
                </div>
                <span class="error-info" id="emailerror"></span>
            </div>

            <div class="input-group">
                <label for="">Password</label>
                <div class="input-field">
                    <i class="fa fa-key"></i>
                    <input type="password" name="password" id="password" placeholder="Min. 8 characters">
                </div>
                <span class="error-info" id="passworderror"></span>
            </div>
        </form>
        <button type="submit" class="reg-btn">Daftar</button>
        
        <p class="login-text">
            Sudah punya akun? <a href="Masuk.html">Masuk</a>
        </p>
        
    </div>
</body>
</html>
